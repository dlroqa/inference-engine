[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-engine"
version = "0.0.0"
description = "Self-hosted, cross-platform inference engine — Block 0 foundation."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Inference Engine" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "platformdirs>=4.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Local llama.cpp inference backend (Block 1). Optional so the core stays
# zero-build; installs a native package.
llama = ["llama-cpp-python>=0.2.90"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "pip-audit>=2.7",
    "websockets>=12",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
inference-engine = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
# The built operator dashboard SPA (engine/static) is produced by the dashboard
# build and bundled into the wheel; it is absent in a source checkout.
engine = ["store/migrations/*.sql", "static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["engine"]
branch = true

[tool.coverage.report]
show_missing = true
# Floor for the whole engine package. Block 0 sits well above this; the margin
# leaves room for later blocks without brittle churn. Raise as coverage grows.
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["engine"]
