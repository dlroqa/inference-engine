# Example Inference Engine configuration (Block 0 foundation).
#
# Copy to a location of your choice and pass it with:
#     inference-engine serve --config ./config.toml
# or point at it with the IE_CONFIG_FILE environment variable.
#
# Precedence (highest wins):
#     CLI flags  >  IE_* env vars  >  this file  >  built-in defaults
#
# Every key below is optional; unset keys use their defaults.

# Bind host. Loopback-only by default. Remote/LAN binding and TLS are a later
# block, so binding to a public interface is intentionally not configurable yet.
host = "127.0.0.1"

# Bind port (1-65535).
port = 8000

# Logging level: CRITICAL | ERROR | WARNING | INFO | DEBUG
log_level = "INFO"

# Base data directory. If unset, an OS-appropriate per-user location is used.
# db_path and log_dir default to subpaths of this directory when not set.
# data_dir = "/var/lib/inference-engine"
# db_path  = "/var/lib/inference-engine/inference_engine.db"
# log_dir  = "/var/lib/inference-engine/logs"

# --- Local inference runtime (Block 1) ---
# One explicitly configured GGUF model, served via llama.cpp. Requires the
# 'llama' extra: pip install "inference-engine[llama]"
# model_path   = "/path/to/model.gguf"   # required to load a model
# model_id     = "local-model"           # identity surfaced to callers
# n_ctx        = 4096                     # context window
# n_threads    =                          # CPU threads (unset = library default)
# n_gpu_layers = 0                        # layers offloaded to GPU (0 = CPU only)
