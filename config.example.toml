# Example Inference Engine configuration (Blocks 0–7).
#
# Copy to a location of your choice and pass it with:
#     inference-engine serve --config ./config.toml
# or point at it with the IE_CONFIG_FILE environment variable.
#
# Precedence (highest wins):
#     CLI flags  >  IE_* env vars  >  this file  >  built-in defaults
#
# Every key below is optional; unset keys use their defaults.

# Bind host. Loopback-only by default. Remote/LAN binding and TLS are a later
# block, so binding to a public interface is intentionally not configurable yet.
host = "127.0.0.1"

# Bind port (1-65535).
port = 8000

# Logging level: CRITICAL | ERROR | WARNING | INFO | DEBUG
log_level = "INFO"

# Base data directory. If unset, an OS-appropriate per-user location is used.
# db_path and log_dir default to subpaths of this directory when not set.
# data_dir = "/var/lib/inference-engine"
# db_path  = "/var/lib/inference-engine/inference_engine.db"
# log_dir  = "/var/lib/inference-engine/logs"

# --- Local inference runtime (Block 1) ---
# One explicitly configured GGUF model, served via llama.cpp. Requires the
# 'llama' extra: pip install "inference-engine[llama]"
# model_path   = "/path/to/model.gguf"   # required to load a model
# model_id     = "local-model"           # identity surfaced to callers
# n_ctx        = 4096                     # context window
# n_threads    =                          # CPU threads (unset = library default)
# n_gpu_layers = 0                        # layers offloaded to GPU (0 = CPU only)

# --- Secure gateway (Block 3) ---
# Network binding beyond loopback must be opted into explicitly.
# allow_network_bind  = false   # set true to bind a non-loopback host
# allow_insecure_bind = false   # set true to allow a network bind with auth off
# require_auth         =        # unset = auto (required when not loopback)

# Per-key request limits (0 = unlimited).
# max_request_bytes      = 2000000
# rate_limit_per_min     = 120
# max_concurrent_per_key = 8

# --- Controlled concurrency (Block 7) ---
# Engine-wide admission control in front of the backend. The llama.cpp runtime
# serializes decoding per model context, so the honest default concurrency is 1;
# overlapping requests wait in a bounded queue and are shed with a retriable 429
# once it is full. See docs/concurrency.md before raising max_concurrency.
# max_concurrency               = 1     # generations allowed to run at once
# max_concurrency_queue         = 32    # waiting requests allowed (0 = shed immediately)
# concurrency_queue_timeout_s   = 30.0  # max wait for a slot (0 = wait indefinitely)

# --- Production deployment (Block 9) ---
# require_model_ready makes /readyz report not-ready until a model is loaded (so a
# load balancer only routes once inference can serve). drain_timeout_s bounds how
# long graceful shutdown waits for in-flight generations to finish. See
# docs/deployment.md.
# require_model_ready = false
# drain_timeout_s     = 30.0

# Compute-unit (CU) quota (0 = unlimited). CU = prompt*w_in + completion*w_out.
# quota_5h_cu       = 1000000    # 5-hour rolling window
# quota_weekly_cu   = 5000000    # weekly fixed cap
# cu_prompt_weight     = 1.0
# cu_completion_weight = 1.0

# --- Model lifecycle (Block 6) ---
# Directory where downloaded/imported GGUF models are stored (default: <data_dir>/models).
# models_dir = "/var/lib/inference-engine/models"
# Hugging Face endpoint (override for a mirror or enterprise hub).
# hf_endpoint = "https://huggingface.co"
# Download streaming chunk size in bytes, and an optional max model size (0 = unlimited).
# download_chunk_bytes = 1048576
# max_model_bytes = 0

# --- Operability core (Block 4) ---
# Telemetry sampler interval, in seconds (0 disables the background sampler).
# metrics_interval_s = 1.0
# Bounded event-bus history (recent events replayed to late WebSocket joiners)
# and per-subscriber queue depth (a slow client drops its oldest events).
# event_history_size     = 200
# event_subscriber_queue = 500
# Bounded recent-log ring (in-memory tail) and the log_events table row cap.
# log_ring_size       = 500
# log_events_max_rows = 2000
