# Example Inference Engine configuration (Blocks 0–10).
#
# Copy to a location of your choice and pass it with:
#     inference-engine serve --config ./config.toml
# or point at it with the IE_CONFIG_FILE environment variable.
#
# Precedence (highest wins):
#     CLI flags  >  IE_* env vars  >  this file  >  built-in defaults
#
# Every key below is optional; unset keys use their defaults.

# Bind host. Loopback-only by default. Remote/LAN binding and TLS are a later
# block, so binding to a public interface is intentionally not configurable yet.
host = "127.0.0.1"

# Bind port (1-65535).
port = 8000

# Logging level: CRITICAL | ERROR | WARNING | INFO | DEBUG
log_level = "INFO"

# Base data directory. If unset, an OS-appropriate per-user location is used.
# db_path and log_dir default to subpaths of this directory when not set.
# data_dir = "/var/lib/inference-engine"
# db_path  = "/var/lib/inference-engine/inference_engine.db"
# log_dir  = "/var/lib/inference-engine/logs"

# --- Local inference runtime (Block 1) ---
# One explicitly configured GGUF model, served via llama.cpp. Requires the
# 'llama' extra: pip install "inference-engine[llama]"
# model_path   = "/path/to/model.gguf"   # required to load a model
# model_id     = "local-model"           # identity surfaced to callers
# n_ctx        = 4096                     # context window
# n_threads    =                          # CPU threads (unset = library default)
# n_gpu_layers = 0                        # layers offloaded to GPU (0 = CPU only)

# --- Remote backend: vLLM / SGLang (Block 10, sub-slices 1-2) ---
# Proxy generation to an external OpenAI-compatible server (vLLM or SGLang)
# instead of the local llama.cpp runtime. Requires the 'remote' extra:
#     pip install "inference-engine[remote]"
# See docs/backends.md for behavior and guarantees.
# backend_kind    = "remote_vllm"                 # or "remote_sglang"; default "llamacpp"
# remote_base_url = "http://vllm.internal:8000/v1"  # server root or .../v1
# remote_model    = "meta-llama/Meta-Llama-3-8B-Instruct"  # what vLLM serves
# model_id        = "team-llama3"                 # what YOUR clients request
# remote_api_key  =                                # prefer IE_REMOTE_API_KEY; never commit secrets
# remote_connect_timeout_s   = 10.0
# remote_read_timeout_s      = 60.0                # max gap between streamed tokens
# remote_max_prestream_retries = 1                 # bounded; never retried after first token
# remote_context_length      =                     # unset = probe /v1/models max_model_len
# remote_tls_verify          = true                # verify the remote's TLS certificate
# remote_prefix_cache        = true                # primary remote maintains a prefix cache
# remote_kv_metrics          = true                # scrape the primary remote's /metrics
# allow_remote_backends      = true                # kill switch: false refuses outbound inference

# --- Multiple backends & routing (Block 10, sub-slices 3-4) ---
# Run several backends at once and route each request to the least-busy healthy
# one. The primary backend above is entry 0; add more with [[remote_workers]].
# primary_max_in_flight caps concurrent generations on the primary (llama.cpp
# serializes, so 1). backend_health_interval_s probes remote liveness (0 = off).
# Raise max_concurrency (Controlled concurrency, above) to overlap across backends.
# primary_max_in_flight     = 1
# backend_health_interval_s = 10.0   # also scrapes remote KV/prefix-cache stats
# prefix_affinity_chars     = 0      # >0 routes prompts sharing N leading chars to one backend
# primary_cost_per_1k_input  = 0.0   # token cost accounting for the primary (5b); 0 = free
# primary_cost_per_1k_output = 0.0
#
# [[remote_workers]]
# name          = "vllm-a"
# kind          = "remote_vllm"      # or "remote_sglang"
# base_url      = "http://gpu-a:8000/v1"
# model         = "meta-llama/Meta-Llama-3-8B-Instruct"
# max_in_flight = 8
# prefix_cache  = true               # server maintains a prefix cache (gates affinity)
# kv_metrics    = true               # scrape /metrics for KV/prefix-cache stats
# cost_per_1k_input  = 0.0           # token cost accounting (5b); 0 = free
# cost_per_1k_output = 0.0
# # api_key     =                    # prefer a secure source; never commit
#
# Virtual auto-models (Block 10, sub-slice 5a): map a client-facing model name to a
# route/cascade policy over the pool. Backend names are "primary" + remote_workers.
# [[virtual_models]]
# name     = "fast"
# policy   = "route"                 # serve from any backend in `backends`
# backends = ["primary", "vllm-a"]
#
# [[virtual_models]]
# name  = "tiered"
# policy = "cascade"                 # try each step in order; first available serves
# steps = [["vllm-a"], ["vllm-b", "sglang-a"]]
#
# External-provider spillover (Block 10, sub-slice 7): OpenAI-compatible endpoints
# used ONLY as overflow when the local pool is saturated. Off by default; enable
# the kill switch AND allowlist their hosts, or startup fails.
# allow_external_providers = true
# egress_allowlist = ["openai.com", "together.ai"]
#
# [[external_providers]]
# name     = "openai"
# base_url = "https://api.openai.com/v1"
# model    = "gpt-4o-mini"
# cost_per_1k_input  = 0.15          # metered per route (5b)
# cost_per_1k_output = 0.60
# # api_key  =                        # prefer a secure source; never commit

# --- Secure gateway (Block 3) ---
# Network binding beyond loopback must be opted into explicitly.
# allow_network_bind  = false   # set true to bind a non-loopback host
# allow_insecure_bind = false   # set true to allow a network bind with auth off
#
# --- gRPC edge (Block 10, sub-slice 6) ---
# An independently secured gRPC InferenceService on its own port; off by default.
# Reuses the same API-key auth (via call metadata) and pipeline as HTTP. Requires
# the 'grpc' extra: pip install "inference-engine[grpc]". See docs/grpc.md.
# grpc_enabled  = false
# grpc_host     = "127.0.0.1"     # non-loopback needs allow_network_bind = true
# grpc_port     = 50051           # 0 = OS-assigned
# grpc_tls_cert = "/etc/ie/grpc.crt"   # set BOTH for a secure port
# grpc_tls_key  = "/etc/ie/grpc.key"
# require_auth         =        # unset = auto (required when not loopback)

# Per-key request limits (0 = unlimited).
# max_request_bytes      = 2000000
# rate_limit_per_min     = 120
# max_concurrent_per_key = 8

# --- Controlled concurrency (Block 7) ---
# Engine-wide admission control in front of the backend. The llama.cpp runtime
# serializes decoding per model context, so the honest default concurrency is 1;
# overlapping requests wait in a bounded queue and are shed with a retriable 429
# once it is full. See docs/concurrency.md before raising max_concurrency.
# max_concurrency               = 1     # generations allowed to run at once
# max_concurrency_queue         = 32    # waiting requests allowed (0 = shed immediately)
# concurrency_queue_timeout_s   = 30.0  # max wait for a slot (0 = wait indefinitely)

# --- Production deployment (Block 9) ---
# require_model_ready makes /readyz report not-ready until a model is loaded (so a
# load balancer only routes once inference can serve). drain_timeout_s bounds how
# long graceful shutdown waits for in-flight generations to finish. See
# docs/deployment.md.
# require_model_ready = false
# drain_timeout_s     = 30.0

# --- Security hardening (Block 9b) ---
# All default to permissive-but-safe; tighten for exposed/air-gapped deployments.
# See docs/security.md.
# ip_allowlist = ["10.0.0.0/8"]   # only these CIDRs may connect (empty = all)
# trust_forwarded_for   = false   # honor X-Forwarded-For (ONLY behind a trusted proxy)
# allow_network_downloads = true  # false = block model downloads (air-gapped)
# allow_model_management  = true  # false = block import/download/load/unload/delete
# allow_structured_output = true  # false = reject JSON/grammar-constrained requests
# diagnostics_enabled     = true  # false = disable the /diagnostics bundle

# Compute-unit (CU) quota (0 = unlimited). CU = prompt*w_in + completion*w_out.
# quota_5h_cu       = 1000000    # 5-hour rolling window
# quota_weekly_cu   = 5000000    # weekly fixed cap
# cu_prompt_weight     = 1.0
# cu_completion_weight = 1.0

# --- Commercial controls / billing (Block 11) ---
# Off by default. With a provider selected and a signing secret set, the inbound
# webhook POST /billing/webhooks/stripe drives the client/plan/key lifecycle.
# Plan and quota values live only in the plans table (managed via
# /admin/billing/plans); webhook payloads select a plan by id but never define
# its limits. See docs/billing.md.
# billing_provider              = "stripe"
# stripe_webhook_secret         = "whsec_..."     # Stripe endpoint signing secret
# stripe_signature_tolerance_s  = 300             # reject signatures older than this
# default_plan                  = "free"          # seeded with the CU limits above; entitlement fallback

# --- Outbound Standard Webhooks (Block 11.2) ---
# Off by default. When enabled, the engine delivers SIGNED billing lifecycle (and
# optional usage-threshold) events to client-registered endpoints, with
# retries/backoff, a dead-letter state, a replayable delivery log, and secret
# rotation. Endpoint URLs must resolve to a host in egress_allowlist (below).
# See docs/webhooks.md.
# webhooks_enabled                = true
# webhook_max_attempts            = 5
# webhook_backoff_schedule_s      = [30, 120, 600, 1800]   # delay before each retry
# webhook_poll_interval_s         = 5
# webhook_delivery_timeout_s      = 10
# webhook_signing_rotation_grace_s = 86400   # old secret stays valid this long after rotate
# webhook_usage_threshold_pct     = 0.8     # 0 = off; emit usage.threshold.reached at this fraction of weekly quota

# --- Client-scoped SSE (Block 11.5) ---
# Off by default. When enabled, a client can stream their own account events (the
# same billing lifecycle / usage-threshold events as outbound webhooks) over SSE
# with Last-Event-ID recovery, plus a reconciliation/polling fetch. CORS is
# restricted to client_cors_origins. See docs/client-events.md.
# client_events_enabled                  = true
# client_sse_heartbeat_s                 = 15
# client_events_retention_max_age_s      = 2592000   # 0 = keep all
# client_events_retention_max_per_client = 1000      # 0 = unlimited
# client_cors_origins                    = ["https://app.example.com"]   # [] = same-origin only

# --- Model lifecycle (Block 6) ---
# Directory where downloaded/imported GGUF models are stored (default: <data_dir>/models).
# models_dir = "/var/lib/inference-engine/models"
# Hugging Face endpoint (override for a mirror or enterprise hub).
# hf_endpoint = "https://huggingface.co"
# Download streaming chunk size in bytes, and an optional max model size (0 = unlimited).
# download_chunk_bytes = 1048576
# max_model_bytes = 0

# --- Operability core (Block 4) ---
# Telemetry sampler interval, in seconds (0 disables the background sampler).
# metrics_interval_s = 1.0
# Bounded event-bus history (recent events replayed to late WebSocket joiners)
# and per-subscriber queue depth (a slow client drops its oldest events).
# event_history_size     = 200
# event_subscriber_queue = 500
# Bounded recent-log ring (in-memory tail) and the log_events table row cap.
# log_ring_size       = 500
# log_events_max_rows = 2000
