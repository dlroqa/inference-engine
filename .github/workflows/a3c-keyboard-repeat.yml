# TEMPORARY diagnostic (never merged; PR #49 review): runs the popover keyboard
# test (Tab to the docs link, then to the A3c "Open ... in Architecture" link,
# Escape, Tab out) 10 times, each a separate pytest process with no retry
# plugin, against the same built dashboard, Chromium and real engine setup as
# ci.yml's browser-acceptance job. Every iteration runs and is recorded; the job
# fails if any iteration failed. Push-triggered on this diagnostic branch only;
# read-only permissions; no secrets; nothing is published.
name: A3c keyboard repeat (diagnostic)

on:
  push:
    branches: ["ci/a3c-keyboard-repeat*"]

permissions:
  contents: read

concurrency:
  group: a3c-keyboard-repeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repeat:
    name: Popover keyboard test x10 (Chromium, real engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MODEL_URL: "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
      MODEL_SHA256: "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d"
      ITERATIONS: "10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Runner inventory
        run: python3 scripts/runner_inventory.py --job "Popover keyboard test x10"

      - name: Require AVX2 (prebuilt llama.cpp wheel)
        run: grep -q avx2 /proc/cpuinfo || { echo "::error::runner lacks AVX2"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard into engine/static
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          test -f ../engine/static/index.html

      - name: Install engine + llama.cpp backend + browser harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llama]" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements/e2e.txt
          python -m playwright install --with-deps chromium
          python -m playwright --version

      - name: Cache tiny GGUF model
        id: gguf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/models/tiny.gguf
          key: gguf-smollm2-135m-q4km-${{ env.MODEL_SHA256 }}

      - name: Download tiny GGUF model
        if: steps.gguf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sL -o ~/models/tiny.gguf "$MODEL_URL"

      - name: Verify model checksum
        run: echo "${MODEL_SHA256}  $HOME/models/tiny.gguf" | sha256sum -c -

      - name: Repeat the focused scenario
        run: |
          SRV=""
          trap 'kill $SRV 2>/dev/null || true' EXIT
          DATA=/tmp/ie-e2e
          OWNER=$(IE_REQUIRE_AUTH=true inference-engine keys create --label owner --data-dir "$DATA" 2>/dev/null \
            | python -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$OWNER"
          IE_REQUIRE_AUTH=true inference-engine serve --port 8140 --data-dir "$DATA" &
          SRV=$!
          for _ in $(seq 1 120); do
            curl -sf http://127.0.0.1:8140/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8140/healthz >/dev/null || { echo "::error::engine not healthy"; exit 1; }
          fails=0
          echo "### Popover keyboard test x${ITERATIONS} (Chromium, real engine)" >> "$GITHUB_STEP_SUMMARY"
          echo "checkout: $(git rev-parse HEAD) (tree $(git rev-parse 'HEAD^{tree}'))" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m playwright --version | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 "$ITERATIONS"); do
            set +e
            IE_E2E_BASE_URL=http://127.0.0.1:8140 \
            IE_E2E_OPERATOR_KEY="$OWNER" \
            IE_E2E_MODEL_PATH="$HOME/models/tiny.gguf" \
            IE_E2E_MODEL_SHA256="$MODEL_SHA256" \
            IE_E2E_SCREENSHOT_DIR="e2e-screenshots/iter-$i" \
              python -m pytest e2e/test_wiring_popovers.py -v -p no:cacheprovider \
                -k "test_keyboard_reaches_scroll_content_and_docs_link" > "iter-$i.txt" 2>&1
            rc=$?
            set -e
            cat "iter-$i.txt"
            [ "$rc" -eq 0 ] || fails=$((fails + 1))
            echo "iteration $i: exit $rc :: $(grep -E '(passed|failed|error)' "iter-$i.txt" | tail -1)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "failed iterations: $fails / $ITERATIONS" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$fails" -eq 0 ]

      # Only the screenshots (taken after assert_no_secrets). Raw pytest output
      # stays in the masked step log: a traceback can print fixture reprs.
      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a3c-keyboard-repeat-screenshots
          path: e2e-screenshots/
          if-no-files-found: warn
