name: Image reachability audit

# Diagnostic evidence for the candidate-image triage (docs/security/
# candidate-image-triage.md, F3 and F4a). Not a release gate and not an
# automatic approval: nothing here decides whether a release may publish.
#
# Authority: `contents: read`, no secrets, no registry login, no push, publish or
# deploy step. The job still builds the candidate image, runs containers and
# writes disposable runner files and one artifact (14 days).
#
# It rebuilds the candidate as release.yml's candidate job does (same Dockerfile,
# base digests and lock files). The rebuild is NOT byte-identical to any scanned
# or published image; its own digests are recorded in candidate.json.
#
# Triggers: changes to this workflow or its probe, or a manual dispatch. It does
# not run on base-image refreshes by itself; the master plan dispatches it then.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/image-audit.yml
      - scripts/image_reachability.py

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: image-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE: ghcr.io/dlroqa/inference-engine:candidate
  # Same pinned fixture as ci.yml and release.yml.
  MODEL_URL: "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
  MODEL_SHA256: "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d"
  # Positive control for the zlib source check: upstream v1.3.1.2, the first
  # release with non-blocking gz support (and gz_vacate), pinned by commit and
  # file checksum.
  ZLIB_CONTROL_COMMIT: 570720b0c24f9686c33f35a1b3165c1f568b96be
  ZLIB_CONTROL_SHA256: 21f87de1e7c4f71f175b5ede78d649056d9aa7e162e46236f7a2434dc6c2326f

jobs:
  audit:
    name: Build candidate + reachability probes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner inventory
        run: python3 scripts/runner_inventory.py --job "Image reachability audit"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the candidate image (linux/amd64), as release.yml
        run: |
          set -euo pipefail
          VERSION=$(python3 scripts/release.py check-version)
          COMMIT=$(git rev-parse HEAD)
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build --platform linux/amd64 \
            --build-arg IE_VERSION="$VERSION" \
            --build-arg IE_BUILD_SHA="$COMMIT" \
            --build-arg IE_BUILD_DATE="$CREATED" \
            --provenance=false --sbom=false \
            --output "type=oci,dest=candidate.oci.tar,name=$CANDIDATE" \
            --output "type=docker,name=$CANDIDATE" \
            .
          mkdir -p out && chmod 0777 out
          DIGESTS=$(python3 scripts/release.py oci-digests candidate.oci.tar)
          rm candidate.oci.tar
          jq -n --arg commit "$COMMIT" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg pr_head "${{ github.event.pull_request.head.sha }}" \
            --arg event "$GITHUB_EVENT_NAME" --arg version "$VERSION" --arg built_at "$CREATED" \
            --argjson digests "$DIGESTS" \
            --arg image_id "$(docker image inspect -f '{{.Id}}' "$CANDIDATE")" \
            --arg probe_sha256 "$(sha256sum scripts/image_reachability.py | cut -d' ' -f1)" \
            --arg dockerfile_sha256 "$(sha256sum Dockerfile | cut -d' ' -f1)" \
            --arg lock_sha256 "$(sha256sum requirements/release-cpu.txt | cut -d' ' -f1)" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg tools "$(docker version -f 'docker {{.Server.Version}}'); $(readelf --version | head -1); $(python3 --version)" \
            '{checkout_commit: $commit, tree: $tree, pr_head: $pr_head, event: $event,
              version: $version, built_at: $built_at, manifest_digest: $digests.manifest,
              config_digest: $digests.config, docker_image_id: $image_id,
              probe_sha256: $probe_sha256, dockerfile_sha256: $dockerfile_sha256,
              release_cpu_lock_sha256: $lock_sha256, run: $run, tools: $tools,
              note: "rebuild; not byte-identical to any scanned or published image"}' \
            | tee out/candidate.json
          docker run --rm --entrypoint dpkg-query "$CANDIDATE" \
            -W -f '${Package}\t${Version}\t${source:Package}\t${source:Version}\n' > out/dpkg.tsv

      - name: F4a — shared-object imports of the affected functions
        run: |
          set -euo pipefail
          CID=$(docker create "$CANDIDATE")
          mkdir rootfs
          docker export "$CID" | sudo tar -x -C rootfs
          docker rm "$CID" >/dev/null
          # Exit 3 = incomplete inspection: fail rather than present gaps as negatives.
          sudo python3 scripts/image_reachability.py elf rootfs --json out/elf.json | tee out/elf.md
          { echo "### F4a: shared-object imports"; cat out/elf.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: F4a — does the image's Debian zlib source contain the CVE-2026-85091 code?
        # Trust chain: the Debian archive keyring inside the digest-pinned base
        # image -> signed trixie InRelease -> Sources.xz checksum -> zlib .dsc
        # checksum -> source archive checksums. Positive control: pinned upstream
        # 1.3.1.2 gzwrite.c must show the code, or the negative result is void.
        run: |
          set -euo pipefail
          EVIDENCE="$PWD/out/zlib-source"
          mkdir -p "$EVIDENCE" zsrc && cd zsrc
          ZSRC=$(awk -F'\t' '$1 == "zlib1g" {print $4}' ../out/dpkg.tsv)
          V=${ZSRC#*:}   # the epoch is not part of file names
          KEYRING=$(ls ../rootfs/usr/share/keyrings/debian-archive-keyring.pgp)
          curl -sfL --retry 3 -o InRelease https://deb.debian.org/debian/dists/trixie/InRelease
          # InRelease may carry several signatures: require a valid one from the
          # image's keyring and no bad one, and read only the verified content.
          gpgv --status-fd 3 --keyring "$KEYRING" --output Release.verified InRelease \
            3> gpgv-status.txt 2> gpgv.txt || true
          if ! grep -q '^\[GNUPG:\] VALIDSIG' gpgv-status.txt \
             || grep -q '^\[GNUPG:\] BADSIG' gpgv-status.txt || [ ! -s Release.verified ]; then
            cat gpgv.txt; echo "::error::InRelease signature not verified"; exit 1
          fi
          SOURCES_SHA=$(awk '/^SHA256:/ {f=1; next} /^[^ ]/ {f=0}
                             f && $3 == "main/source/Sources.xz" {print $1}' Release.verified)
          test -n "$SOURCES_SHA"
          curl -sfL --retry 3 -o Sources.xz https://deb.debian.org/debian/dists/trixie/main/source/Sources.xz
          echo "$SOURCES_SHA  Sources.xz" | sha256sum -c -
          # The zlib paragraph of the signed index must carry the image's version.
          xz -dc Sources.xz | python3 -c 'import sys
          paragraphs = sys.stdin.read().split("\n\n")
          print(next(p for p in paragraphs if p.startswith("Package: zlib\n")))' > zlib-paragraph.txt
          grep -qx "Version: $ZSRC" zlib-paragraph.txt || {
            echo "::error::trixie Sources does not list zlib $ZSRC; investigate (snapshot.debian.org)"
            exit 1
          }
          DIR=$(awk '/^Directory:/ {print $2}' zlib-paragraph.txt)
          awk '/^Checksums-Sha256:/ {f=1; next} /^[^ ]/ {f=0} f && NF == 3 {print $1 "  " $3}' \
            zlib-paragraph.txt > files.sha256
          while read -r _ file; do
            curl -sfL --retry 3 -o "$file" "https://deb.debian.org/debian/$DIR/$file"
          done < files.sha256
          sha256sum -c files.sha256
          mkdir tree
          tar -xf zlib_*.orig.tar.* -C tree --strip-components=1
          tar -xf "zlib_$V.debian.tar."* -C tree
          PATCHES=()
          if [ -f tree/debian/patches/series ]; then
            while read -r patch _; do
              case "$patch" in ''|'#'*) continue ;; esac
              (cd tree && patch -p1 --quiet < "debian/patches/$patch")
              PATCHES+=("$patch")
            done < tree/debian/patches/series
          fi
          curl -sfL --retry 3 -o control-gzwrite.c \
            "https://raw.githubusercontent.com/madler/zlib/$ZLIB_CONTROL_COMMIT/gzwrite.c"
          echo "$ZLIB_CONTROL_SHA256  control-gzwrite.c" | sha256sum -c -
          count() { grep -c "$1" "$2" || true; }
          CTL_VACATE=$(count gz_vacate control-gzwrite.c)
          CTL_AGAIN=$(count 'state->again' control-gzwrite.c)
          if [ "$CTL_VACATE" -eq 0 ] || [ "$CTL_AGAIN" -eq 0 ]; then
            echo "::error::positive control did not detect the code; the negative check is void"
            exit 1
          fi
          VACATE=$(count gz_vacate tree/gzwrite.c)
          AGAIN=$(count 'state->again' tree/gzwrite.c)
          ZLIB_H=$(grep -m1 '#define ZLIB_VERSION' tree/zlib.h)
          # Keep the inputs of the conclusion (small) for durable retention.
          cp InRelease zlib-paragraph.txt files.sha256 zlib_*.dsc zlib_*.debian.tar.* \
             control-gzwrite.c gpgv.txt gpgv-status.txt "$EVIDENCE/"
          cp tree/gzwrite.c "$EVIDENCE/inspected-gzwrite.c"
          cp tree/zlib.h "$EVIDENCE/inspected-zlib.h"
          jq -n --arg source "$ZSRC" --arg dir "$DIR" \
            --arg keyring "${KEYRING#../rootfs}" \
            --arg inrelease_sha256 "$(sha256sum InRelease | cut -d' ' -f1)" \
            --arg sources_xz_sha256 "$SOURCES_SHA" \
            --arg gpgv "$(grep '^\[GNUPG:\] VALIDSIG' gpgv-status.txt | cut -d' ' -f3 | paste -sd,)" \
            --argjson files "$(awk '{print $2 "\t" $1}' files.sha256 | jq -R 'split("\t") | {(.[0]): .[1]}' | jq -s add)" \
            --argjson patches "$(printf '%s\n' "${PATCHES[@]}" | jq -R 'select(length > 0)' | jq -s .)" \
            --arg zlib_h "$ZLIB_H" \
            --argjson vacate "$VACATE" --argjson again "$AGAIN" \
            --arg control_commit "$ZLIB_CONTROL_COMMIT" --arg control_sha256 "$ZLIB_CONTROL_SHA256" \
            --argjson ctl_vacate "$CTL_VACATE" --argjson ctl_again "$CTL_AGAIN" \
            --arg snapshot "https://snapshot.debian.org/package/zlib/$ZSRC/" \
            '{debian_source: $source, archive_directory: $dir,
              trust: {keyring_in_image: $keyring, inrelease_sha256: $inrelease_sha256,
                      valid_signature_fingerprints: $gpgv, sources_xz_sha256: $sources_xz_sha256},
              source_files_sha256: $files, durable_reference: $snapshot,
              debian_patches_applied: $patches, zlib_h: $zlib_h,
              gzwrite_c: {gz_vacate: $vacate, nonblocking_state_again: $again},
              positive_control: {repository: "madler/zlib", commit: $control_commit,
                                 file: "gzwrite.c", sha256: $control_sha256,
                                 gz_vacate: $ctl_vacate, nonblocking_state_again: $ctl_again}}' \
            | tee ../out/zlib-source.json
          { echo "### F4a: Debian zlib source"; echo '```json'; cat ../out/zlib-source.json; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: F3 — third-party stdlib use, SQLite and zlib identity (inside the image)
        run: |
          set -euo pipefail
          # Exit 3 = incomplete scan (unparsed files, distributions without RECORD).
          docker run --rm -v "$PWD/scripts/image_reachability.py:/opt/probe/probe.py:ro" \
            -v "$PWD/out:/out" --entrypoint python "$CANDIDATE" \
            /opt/probe/probe.py python-static --json /out/static.json | tee out/static.md
          { echo "### F3: imports by installed distribution"; cat out/static.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache tiny GGUF model
        id: gguf-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/models/tiny.gguf
          key: gguf-smollm2-135m-q4km-${{ env.MODEL_SHA256 }}

      - name: Download tiny GGUF model
        if: steps.gguf-cache.outputs.cache-hit != 'true'
        run: mkdir -p ~/models && curl -sfL -o ~/models/tiny.gguf "$MODEL_URL"

      - name: Verify model checksum before use
        run: echo "${MODEL_SHA256}  $HOME/models/tiny.gguf" | sha256sum -c -

      - name: F3/F4a — record a checked serve session and a backup/restore
        # Fresh, disposable Docker volume; no operator data. Every workload step
        # and each process's exit must succeed, or the recording is not evidence.
        run: |
          set -euo pipefail
          PROBE=(-v "$PWD/scripts/image_reachability.py:/opt/probe/probe.py:ro")
          docker volume create ie-audit-data >/dev/null
          docker run -d --name ie-audit -p 127.0.0.1:8000:8000 \
            -e IE_REQUIRE_AUTH=true -v ie-audit-data:/data "${PROBE[@]}" \
            --entrypoint python "$CANDIDATE" \
            /opt/probe/probe.py record --out /data/record-serve.json -- serve
          for _ in $(seq 120); do curl -sf http://127.0.0.1:8000/healthz >/dev/null && break; sleep 1; done
          IE_AUDIT_KEY=$(docker exec ie-audit inference-engine keys create --label audit | jq -r .token)
          echo "::add-mask::$IE_AUDIT_KEY"
          export IE_AUDIT_KEY
          docker exec -i ie-audit sh -c 'mkdir -p /data/models && cat > /data/models/audit.gguf' \
            < "$HOME/models/tiny.gguf"
          WORKLOAD=0
          timeout 600 python3 scripts/image_reachability.py workload \
            --model-path /data/models/audit.gguf --json out/workload.json || WORKLOAD=$?
          unset IE_AUDIT_KEY
          docker stop -t 40 ie-audit >/dev/null
          SERVE_EXIT=$(docker inspect -f '{{.State.ExitCode}}' ie-audit)
          docker logs ie-audit 2>&1 | grep -c '"event": "drain_complete"' > out/serve-drain-count.txt || true
          docker cp ie-audit:/data/record-serve.json out/record-serve.json
          docker rm ie-audit >/dev/null
          # One-off CLI processes, recorded the same way.
          docker run --rm -v ie-audit-data:/data --entrypoint sh "$CANDIDATE" \
            -c 'mkdir -p /data/backups /data/restore'
          ARCHIVE=$(docker run --rm -v ie-audit-data:/data "${PROBE[@]}" --entrypoint python \
            "$CANDIDATE" /opt/probe/probe.py record --out /data/record-backup.json -- \
            backup --out /data/backups | jq -r .archive)
          RESTORED=$(docker run --rm -v ie-audit-data:/data "${PROBE[@]}" -e IE_DATA_DIR=/data/restore \
            --entrypoint python "$CANDIDATE" /opt/probe/probe.py record \
            --out /data/record-restore.json -- restore --from "$ARCHIVE" | jq -r .db_path)
          for f in record-backup.json record-restore.json; do
            docker run --rm -v ie-audit-data:/data --entrypoint cat "$CANDIDATE" "/data/$f" > "out/$f"
          done
          docker volume rm ie-audit-data >/dev/null
          jq -n --argjson workload "$WORKLOAD" --argjson serve_exit "$SERVE_EXIT" \
            --argjson drain "$(cat out/serve-drain-count.txt)" \
            --arg archive "$ARCHIVE" --arg restored "$RESTORED" \
            '{workload_exit: $workload, serve_exit: $serve_exit, drain_complete_events: $drain,
              backup_archive: $archive, restore_db_path: $restored}' | tee out/session-outcome.json
          {
            echo "### F3/F4a: checked session outcome"
            echo '```json'; cat out/session-outcome.json; jq '.steps' out/workload.json; echo '```'
            for f in record-serve record-backup record-restore; do
              echo "#### $f"; echo '```json'; cat "out/$f.json"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          test "$WORKLOAD" -eq 0 || { echo "::error::workload failed (see workload.json)"; exit 1; }
          test "$SERVE_EXIT" -eq 0 || { echo "::error::serve exited $SERVE_EXIT"; exit 1; }
          test "$(cat out/serve-drain-count.txt)" -ge 1 || { echo "::error::no drain_complete"; exit 1; }
          case "$ARCHIVE" in /data/backups/*.tar.gz) ;; *) echo "::error::backup failed"; exit 1 ;; esac
          test "$RESTORED" = /data/restore/inference_engine.db || { echo "::error::restore failed"; exit 1; }

      - name: Checksums of the evidence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          { echo "### Evidence checksums"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the audit evidence (14 days)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-reachability-audit
          path: out/
          retention-days: 14
          if-no-files-found: error
