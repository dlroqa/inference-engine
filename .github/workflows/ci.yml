name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test & coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (type check)
        run: mypy

      - name: Pytest with coverage (enforces fail_under)
        run: |
          pytest --cov=engine --cov-report=xml --cov-report=term-missing \
                 --junitxml=pytest-report.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: ignore

  integration-llama:
    name: llama.cpp integration (real GGUF)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine + llama.cpp CPU backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llama]" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Cache tiny GGUF model
        id: gguf-cache
        uses: actions/cache@v4
        with:
          path: ~/models/tiny.gguf
          key: gguf-smollm2-135m-q4km-v1

      - name: Download tiny GGUF model
        if: steps.gguf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sL -o ~/models/tiny.gguf \
            "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"

      - name: Run gated integration test
        run: |
          IE_TEST_GGUF="$HOME/models/tiny.gguf" \
            pytest tests/inference/test_llamacpp_integration.py -v

      - name: Smoke-test the generate CLI against the real model
        run: |
          inference-engine generate \
            --model-path "$HOME/models/tiny.gguf" \
            --prompt "The capital of France is" \
            --max-tokens 16

  build:
    name: Build & validate package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --upgrade pip
          /tmp/verify/bin/pip install dist/*.whl

      - name: Smoke-test the installed CLI
        run: |
          /tmp/verify/bin/inference-engine version
          /tmp/verify/bin/inference-engine migrate --data-dir /tmp/ie-data
          test -f /tmp/ie-data/inference_engine.db

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
