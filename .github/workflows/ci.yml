name: CI

on:
  # Only push to main runs post-merge CI; feature branches are covered by their
  # pull_request run, so a branch push does not trigger a second, redundant
  # pipeline (which doubled cost and the exposure to transient install flakes).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manual runs (e.g. AVX/real-model verification on demand)
  # The release workflow reuses these gates verbatim (docs/releasing.md). It
  # builds its own single candidate image, so it skips the container smoke here.
  workflow_call:
    inputs:
      skip-container:
        type: boolean
        default: false

concurrency:
  # Include the workflow name: when release.yml calls this file, github.workflow
  # is "Release", so the two runs for one PR never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Make network-bound dependency installs resilient to transient PyPI / wheel-index
# blips (the native llama.cpp wheel is fetched from a GitHub Pages index).
env:
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:
  test:
    name: Lint, type-check, test & coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Runner inventory
        run: python scripts/runner_inventory.py --job "Lint, type-check, test & coverage (${{ matrix.python-version }})"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format check)
        run: ruff format --check --diff .

      - name: Mypy (type check)
        run: mypy

      - name: Route inventory is current (dashboard wiring drift guard)
        # The dashboard's "wired to" explanations are checked against this file by
        # vitest; a backend route change must regenerate it (prints the diff).
        run: python scripts/export_routes.py --check

      - name: Pytest with coverage (enforces fail_under)
        run: |
          pytest --cov=engine --cov-report=xml --cov-report=term-missing \
                 --junitxml=pytest-report.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        continue-on-error: true # never fail the job if artifact storage quota is full
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: ignore
          retention-days: 2

  cross-platform:
    name: Cross-platform build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Runner inventory
        run: python scripts/runner_inventory.py --job "Cross-platform build & test (${{ matrix.os }})"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build distribution
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install built wheel
        # Keep the test dependencies from the editable install, but replace the
        # application itself with the artifact produced above. This catches
        # missing package data and build-only regressions without a second
        # dependency resolution on the more expensive macOS and Windows runners.
        run: |
          python -c "from pathlib import Path; Path(r'${{ runner.temp }}/wheel-test').mkdir(parents=True, exist_ok=True)"
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"

      - name: Run portable test suite against built wheel
        # Running outside the checkout ensures imports resolve to the installed
        # wheel rather than the source tree.
        working-directory: ${{ runner.temp }}/wheel-test
        run: python -m pytest -q ${{ github.workspace }}/tests

  dashboard:
    name: Operator dashboard (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Runner inventory
        run: python3 scripts/runner_inventory.py --job "Operator dashboard (build + tests)"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: npm audit of the dashboard lockfile (report only; policy unchanged)
        working-directory: dashboard
        shell: bash
        run: |
          # npm exits non-zero when findings exist; the report script separates a
          # completed audit (exit 0, findings listed) from one that failed to run.
          npm audit --json > ../npm-audit.json || true
          python3 ../scripts/npm_audit_report.py ../npm-audit.json --package-json package.json

      - name: Type-check
        working-directory: dashboard
        run: npm run typecheck

      - name: Component tests (vitest)
        working-directory: dashboard
        run: python3 ../scripts/measure.py run --label "vitest (dashboard)" -- npm run test:run

      - name: Build SPA into engine/static
        working-directory: dashboard
        run: python3 ../scripts/measure.py run --label "vite build (dashboard)" -- npm run build

      - name: Verify build output
        run: test -f engine/static/index.html

  integration-llama:
    name: llama.cpp integration (real GGUF, AVX)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        # Explicit bash => `-eo pipefail`, so `smoke | tee` fails when the smoke does.
        shell: bash
    env:
      # SmolLM2-135M-Instruct-Q4_K_M.gguf — pinned for supply-chain integrity.
      MODEL_URL: "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
      MODEL_SHA256: "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Report runner CPU features (must include avx2)
        run: |
          echo "### Runner CPU (integration-llama)" >> "$GITHUB_STEP_SUMMARY"
          FLAGS=$(grep -m1 -oE '(avx512f|avx2|avx|fma|f16c|sse4_2)' /proc/cpuinfo | sort -u | tr '\n' ' ')
          echo "CPU flags: $FLAGS" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q avx2 /proc/cpuinfo || { echo "::error::runner lacks AVX2"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Runner inventory
        run: python scripts/runner_inventory.py --job "llama.cpp integration (real GGUF, AVX)"

      - name: Install engine + llama.cpp CPU backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llama]" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Cache tiny GGUF model
        id: gguf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/models/tiny.gguf
          key: gguf-smollm2-135m-q4km-${{ env.MODEL_SHA256 }}

      - name: Download tiny GGUF model
        if: steps.gguf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sL -o ~/models/tiny.gguf "$MODEL_URL"

      - name: Verify model checksum
        run: |
          echo "${MODEL_SHA256}  $HOME/models/tiny.gguf" | sha256sum -c -

      - name: Run gated integration test
        run: |
          IE_TEST_GGUF="$HOME/models/tiny.gguf" \
            pytest tests/inference/test_llamacpp_integration.py -v

      - name: Render a real completion (proof artifact)
        run: |
          mkdir -p artifacts
          inference-engine generate \
            --model-path "$HOME/models/tiny.gguf" \
            --prompt "The capital of France is" \
            --max-tokens 24 \
            > artifacts/generation.txt 2> artifacts/generation.result.json
          {
            echo "### Real llama.cpp generation"
            echo '```'
            cat artifacts/generation.txt
            echo '```'
            echo "Result: \`$(cat artifacts/generation.result.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generation proof
        continue-on-error: true # summary above carries the proof if storage is full
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-generation
          path: artifacts/*
          retention-days: 2

      - name: OpenAI SDK against the real model (server + SDK)
        run: |
          IE_MODEL_PATH="$HOME/models/tiny.gguf" IE_MODEL_ID=tiny \
            inference-engine serve --port 8123 --data-dir /tmp/ie-serve &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          IE_MODEL_ID=tiny python scripts/real_model_sdk_smoke.py

      - name: Anthropic SDK + structured output against the real model
        run: |
          IE_MODEL_PATH="$HOME/models/tiny.gguf" IE_MODEL_ID=tiny \
            inference-engine serve --port 8127 --data-dir /tmp/ie-serve-anthropic &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8127/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          IE_SMOKE_BASE=http://127.0.0.1:8127 IE_MODEL_ID=tiny python scripts/anthropic_sdk_smoke.py
          IE_SMOKE_BASE=http://127.0.0.1:8127 IE_MODEL_ID=tiny python scripts/structured_output_smoke.py

      - name: Dashboard control-plane smoke (real model load/gen/logs/keys/system)
        run: |
          IE_MODEL_PATH="$HOME/models/tiny.gguf" IE_MODEL_ID=tiny \
            inference-engine serve --port 8124 --data-dir /tmp/ie-serve-dash &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8124/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          # Real-model mode (no --skip-generation): the model must load, generate,
          # and /admin/system must report inference available — no silent skip.
          python scripts/dashboard_smoke.py --base-url http://127.0.0.1:8124 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/measure.py pid --label "engine, real-model dashboard smoke" "$SRV"

      - name: Model lifecycle smoke (import → load → generate → unload → delete)
        run: |
          inference-engine serve --port 8125 --data-dir /tmp/ie-serve-ml &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8125/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          python scripts/model_lifecycle_smoke.py \
            --base-url http://127.0.0.1:8125 --model-path "$HOME/models/tiny.gguf"

      - name: Concurrency load test (real model, bounded admission)
        run: |
          IE_MODEL_PATH="$HOME/models/tiny.gguf" IE_MODEL_ID=tiny \
            inference-engine serve --port 8126 --data-dir /tmp/ie-serve-load &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8126/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          # Repeatable profile: 64 requests, 16 concurrent, on the AVX2 runner.
          # Verifies the engine bounds concurrent load to success + retriable 429
          # shedding (never a crash / 5xx), and reports the scheduler counters.
          python scripts/load_test.py --base-url http://127.0.0.1:8126 \
            --model tiny --concurrency 16 --requests 64 --max-tokens 16 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/measure.py pid --label "engine, 64-request load test" "$SRV"

      - name: Remote adapters (vLLM + SGLang) against a real OpenAI-compatible server
        run: |
          # vLLM/SGLang need a GPU that hosted runners lack, so the remote adapters
          # are exercised against a real *model* server: a second engine serving the
          # tiny GGUF behind our OpenAI edge stands in here (operators validate real
          # vLLM/SGLang on a GPU host with the same scripts/remote_smoke.py). Both
          # adapters share one core, so both are smoked over real HTTP.
          IE_MODEL_PATH="$HOME/models/tiny.gguf" IE_MODEL_ID=tiny \
            inference-engine serve --port 8130 --data-dir /tmp/ie-upstream &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8130/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          python scripts/remote_smoke.py --backend vllm \
            --base-url http://127.0.0.1:8130/v1 --model tiny --wait \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/remote_smoke.py --backend sglang \
            --base-url http://127.0.0.1:8130/v1 --model tiny \
            | tee -a "$GITHUB_STEP_SUMMARY"

  browser-acceptance:
    name: Dashboard in a real browser (real engine + GGUF)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        shell: bash
    env:
      MODEL_URL: "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
      MODEL_SHA256: "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Runner inventory
        run: python3 scripts/runner_inventory.py --job "Dashboard in a real browser (real engine + GGUF)"

      - name: Require AVX2 (prebuilt llama.cpp wheel)
        run: grep -q avx2 /proc/cpuinfo || { echo "::error::runner lacks AVX2"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard into engine/static
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          test -f ../engine/static/index.html

      - name: Install engine + llama.cpp backend + browser harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llama]" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements/e2e.txt
          python -m playwright install --with-deps chromium

      - name: Cache tiny GGUF model
        id: gguf-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/models/tiny.gguf
          key: gguf-smollm2-135m-q4km-${{ env.MODEL_SHA256 }}

      - name: Download tiny GGUF model
        if: steps.gguf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/models
          curl -sL -o ~/models/tiny.gguf "$MODEL_URL"

      - name: Verify model checksum
        run: echo "${MODEL_SHA256}  $HOME/models/tiny.gguf" | sha256sum -c -

      - name: Run the browser acceptance suite (auth on, no model preloaded)
        run: |
          DATA=/tmp/ie-e2e
          # The owner key is created with the CLI (shown once) and kept only in
          # this step's environment; it is masked and never printed.
          OWNER=$(IE_REQUIRE_AUTH=true inference-engine keys create --label owner --data-dir "$DATA" 2>/dev/null \
            | python -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$OWNER"
          IE_REQUIRE_AUTH=true inference-engine serve --port 8140 --data-dir "$DATA" &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8140/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          IE_E2E_BASE_URL=http://127.0.0.1:8140 \
          IE_E2E_OPERATOR_KEY="$OWNER" \
          IE_E2E_MODEL_PATH="$HOME/models/tiny.gguf" \
            python -m pytest e2e -v -p no:cacheprovider --junitxml=e2e-report.xml \
            | tee e2e-output.txt
          python scripts/measure.py pid --label "engine, browser acceptance" "$SRV"
          {
            echo "### Browser acceptance (Chromium, real engine, real GGUF)"
            echo '```'
            grep -E "PASSED|FAILED|ERROR|passed|failed" e2e-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & validate package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Runner inventory
        run: python scripts/runner_inventory.py --job "Build & validate package"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the operator dashboard into engine/static
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          test -f ../engine/static/index.html

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python scripts/measure.py run --label "python -m build (sdist + wheel)" -- python -m build

      - name: Verify release version + dashboard bundled in the wheel
        run: |
          VERSION=$(python scripts/release.py check-version)
          python scripts/release.py verify-wheel dist/*.whl --expect-version "$VERSION"

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --upgrade pip
          /tmp/verify/bin/pip install dist/*.whl

      - name: Smoke-test the installed CLI
        run: |
          /tmp/verify/bin/inference-engine version
          /tmp/verify/bin/inference-engine migrate --data-dir /tmp/ie-data
          test -f /tmp/ie-data/inference_engine.db

      - name: Smoke-test the running server (health endpoints)
        run: |
          /tmp/verify/bin/inference-engine serve --data-dir /tmp/ie-serve --port 8137 &
          SRV=$!
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8137/healthz >/dev/null 2>&1 && break
            sleep 0.25
          done
          echo "healthz: $(curl -sf http://127.0.0.1:8137/healthz)"
          echo "readyz:  $(curl -sf http://127.0.0.1:8137/readyz)"
          # Operability REST surface (loopback = allowed): metrics snapshot must
          # be valid JSON and honestly report energy as measured-or-unavailable.
          METRICS=$(curl -sf http://127.0.0.1:8137/metrics)
          echo "metrics energy: $(echo "$METRICS" | python -c 'import sys,json; print(json.load(sys.stdin)["energy"]["state"])')"
          # The bundled dashboard SPA is served from the installed wheel.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8137/dashboard/)" = "200"
          # Control-plane smoke in explicit no-model mode (generation skipped;
          # the /admin/system contract is still checked).
          python scripts/dashboard_smoke.py --base-url http://127.0.0.1:8137 --skip-generation
          kill "$SRV" 2>/dev/null || true

      - name: Upload distributions
        continue-on-error: true # never fail the build if artifact storage quota is full
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*
          retention-days: 2

  security-audit:
    name: Dependency CVE audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Runner inventory
        run: python scripts/runner_inventory.py --job "Dependency CVE audit (pip-audit)"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit (advisory — does not gate the build)
        continue-on-error: true # CVE visibility, not a hard gate; review advisories
        run: |
          echo "### Dependency CVE audit" >> "$GITHUB_STEP_SUMMARY"
          pip-audit --progress-spinner off 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate SBOM artifact
        run: python scripts/generate_sbom.py --out sbom.json
      - name: Upload SBOM
        continue-on-error: true # never fail on artifact-quota limits
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 7

  container:
    name: Docker image (build + start smoke)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.skip-container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Runner inventory
        run: python3 scripts/runner_inventory.py --job "Docker image (build + start smoke)"

      - name: Build image (CPU, llama.cpp backend included)
        run: |
          # BuildKit runs inside the Docker daemon, outside this step's process
          # tree, so build memory is not attributable here — report it honestly.
          echo "MEASURE docker build: peak memory unmeasured (BuildKit runs in the daemon)"
          echo "- \`docker build\`: peak memory unmeasured (BuildKit runs in the Docker daemon)" >> "$GITHUB_STEP_SUMMARY"
          docker build \
            --build-arg IE_VERSION="$(python3 scripts/release.py check-version)" \
            --build-arg IE_BUILD_SHA="${GITHUB_SHA::7}" \
            --build-arg IE_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t inference-engine:ci .

      - name: Start container from a clean environment
        run: |
          docker run -d --name ie -p 8000:8000 -v ie-data:/data inference-engine:ci
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Smoke health, version, and dashboard
        run: |
          HEALTH=$(curl -sf http://127.0.0.1:8000/healthz)
          echo "healthz: $HEALTH"
          echo "$HEALTH" | python -c 'import sys,json; assert json.load(sys.stdin)["status"]=="ok"'
          VERSION=$(curl -sf http://127.0.0.1:8000/version)
          echo "version: $VERSION"
          echo "$VERSION" | python -c 'import sys,json; d=json.load(sys.stdin); assert d["commit"], "build sha not surfaced"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/dashboard/)" = "200"
          # Runs as a non-root user.
          test "$(docker exec ie id -u)" != "0"
          # The CPU llama.cpp backend is always present in the image.
          docker exec ie python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"

      - name: Container peak memory (whole cgroup)
        run: python3 scripts/measure.py cgroup --label "container, start + smoke" --container ie

      - name: Graceful stop
        run: |
          docker stop -t 40 ie
          docker logs ie 2>&1 | grep -q '"event": "drain_complete"' || { echo "::error::no graceful drain on stop"; docker logs ie; exit 1; }

  ci-success:
    # Single gate for the whole pipeline (build + render + test). Branch
    # protection can require just this check. Fails if any needed job failed
    # or was skipped, so the machine's local limits never mask a real failure.
    name: CI passed (build + render + test)
    runs-on: ubuntu-latest
    if: always()
    needs: [test, cross-platform, dashboard, browser-acceptance, integration-llama, build, container]
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "test:              ${{ needs.test.result }}"
          echo "cross-platform:    ${{ needs.cross-platform.result }}"
          echo "dashboard:         ${{ needs.dashboard.result }}"
          echo "browser:           ${{ needs.browser-acceptance.result }}"
          echo "integration-llama: ${{ needs.integration-llama.result }}"
          echo "build:             ${{ needs.build.result }}"
          echo "container:         ${{ needs.container.result }}"
          CONTAINER="${{ needs.container.result }}"
          # Only a release (workflow_call with skip-container) may skip it.
          if [ "$CONTAINER" = "skipped" ] && [ "${{ inputs.skip-container }}" = "true" ]; then
            CONTAINER=success
          fi
          if [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.cross-platform.result }}" != "success" ] \
             || [ "${{ needs.dashboard.result }}" != "success" ] \
             || [ "${{ needs.browser-acceptance.result }}" != "success" ] \
             || [ "${{ needs.integration-llama.result }}" != "success" ] \
             || [ "${{ needs.build.result }}" != "success" ] \
             || [ "$CONTAINER" != "success" ]; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi
          echo "All CI jobs succeeded." >> "$GITHUB_STEP_SUMMARY"
